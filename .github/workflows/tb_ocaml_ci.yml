name: tb_ocaml ci

on:
  push:
    paths:
      - ".github/workflows/tb_ocaml_ci.yml"
      - "ocam/**"
      - "README.md"
  pull_request:
    paths:
      - ".github/workflows/tb_ocaml_ci.yml"
      - "ocam/**"
      - "README.md"

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ocam
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up OxCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: oxcaml-compiler.5.2.0minus31
          opam-repositories: |
            ox: git+https://github.com/oxcaml/opam-repository.git
            default: git+https://github.com/ocaml/opam-repository.git

      - name: Install dependencies
        run: |
          opam install . --deps-only --with-test --with-doc
          opam install -y ocamlformat.0.26.2+ox1

      - name: Build
        run: opam exec -- dune build

      - name: Build docs
        run: opam exec -- dune build @doc

      - name: Run Dune runtest
        run: opam exec -- dune runtest

      - name: Build benchmark
        run: opam exec -- dune build @bench

      - name: Check formatting
        run: |
          find . -name _build -prune -o \( -name '*.ml' -o -name '*.mli' \) -print0 \
            | xargs -0 opam exec -- ocamlformat --check
