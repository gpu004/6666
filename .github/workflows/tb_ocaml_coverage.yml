name: tb_ocaml coverage

on:
  push:
    paths:
      - ".github/workflows/tb_ocaml_coverage.yml"
      - "ocam/**"
      - "README.md"
  pull_request:
    paths:
      - ".github/workflows/tb_ocaml_coverage.yml"
      - "ocam/**"
      - "README.md"

jobs:
  coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ocam
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up OxCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: oxcaml-compiler.5.2.0minus31
          dune-cache: true
          opam-repositories: |
            ox: git+https://github.com/oxcaml/opam-repository.git
            default: git+https://github.com/ocaml/opam-repository.git

      - name: Install dependencies
        run: |
          opam install . --deps-only --with-test

      - name: Run coverage-instrumented tests
        run: |
          rm -rf _coverage
          mkdir -p _coverage
          BISECT_SILENT=YES BISECT_FILE="$PWD/_coverage/bisect" \
            opam exec -- dune runtest --instrument-with bisect_ppx --force

      - name: Enforce coverage threshold
        env:
          MINIMUM_COVERAGE: "75"
        run: |
          summary="$(opam exec -- bisect-ppx-report summary --coverage-path _coverage)"
          echo "$summary"
          percent="$(printf '%s\n' "$summary" | sed -n 's/.*(\([0-9.]*\)%).*/\1/p' | head -n1)"
          if [ -z "$percent" ]; then
            echo "could not parse coverage percentage" >&2
            exit 1
          fi
          if awk -v p="$percent" -v m="$MINIMUM_COVERAGE" 'BEGIN { exit !(p + 0 < m + 0) }'; then
            echo "coverage ${percent}% is below the ${MINIMUM_COVERAGE}% minimum" >&2
            exit 1
          fi

      - name: Generate HTML report
        run: opam exec -- bisect-ppx-report html --coverage-path _coverage

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: tb_ocaml-coverage-html
          path: ocam/_coverage
